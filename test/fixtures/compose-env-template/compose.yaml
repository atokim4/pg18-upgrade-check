services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
  db-pinned:
    image: postgres:18
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pinned:/var/lib/postgresql/data
volumes:
  pgdata:
  pinned:
